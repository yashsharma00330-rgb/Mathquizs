<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>6-Level Math Quiz</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6f9;color:#333;margin:0;padding:0}
header{background:#4CAF50;color:white;text-align:center;padding:25px}
section{padding:20px;max-width:800px;margin:auto}
.card{background:white;padding:20px;border-radius:10px;margin-bottom:20px;box-shadow:0 4px 8px rgba(0,0,0,0.1)}
input,button{padding:10px;margin-top:10px;font-size:1rem}
button{cursor:pointer;background:#4CAF50;color:white;border:none;border-radius:5px}
button:hover{background:#388e3c}
#message{font-weight:bold;margin-top:15px}
#levelDisplay,#score,#correct,#wrong,#timer{font-weight:bold}
.leaderboard{margin-top:20px;padding:10px;border:1px solid #ccc;border-radius:5px;background:#fafafa;}
</style>
</head>
<body>

<header>
<h1>6-Level Math Quiz 🧮</h1>
<p>Leaderboard & Timer</p>
</header>

<section id="login" class="card">
<h2>Enter Your Name</h2>
<input id="playerName" placeholder="Your Name" style="width:100%;">
<button onclick="startGame()">Start Quiz</button>
</section>

<section id="game" class="card" style="display:none;">
<h3>Player: <span id="player"></span></h3>
<h4>Level: <span id="levelDisplay">1</span> | Timer: <span id="timer">15</span>s</h4>
<p id="questionText"></p>
<input type="number" id="answerInput" placeholder="Enter answer">
<button onclick="submitAnswer()">Submit</button>
<p id="message"></p>
<p>Score: <span id="score">0</span> | Correct: <span id="correct">0</span> | Wrong: <span id="wrong">0</span></p>
</section>

<section id="leaderboardSection" class="card" style="display:none;">
<h2>🏆 Leaderboard</h2>
<div id="leaderboard" class="leaderboard"></div>
<button onclick="restartGame()">Restart Game</button>
</section>

<script>
// Game Variables
let currentLevel = 1;
let questionCount = 0;
let totalQuestions = 30;
let score = 0;
let correct = 0;
let wrong = 0;
let playerNameText = "";
let leaderboard = [];
let timer = 15;
let timerInterval;
let currentAnswer;

// Start Game
function startGame(){
  playerNameText = document.getElementById("playerName").value || "Player";
  document.getElementById("player").innerText = playerNameText;
  document.getElementById("login").style.display = "none";
  document.getElementById("game").style.display = "block";
  score=0; correct=0; wrong=0; currentLevel=1; questionCount=0;
  updateStats();
  generateQuestion();
}

// Generate Random Question
function generateQuestion(){
  clearInterval(timerInterval);
  timer=15;
  document.getElementById("timer").innerText = timer;

  let num1, num2, operator;
  if(currentLevel <= 2){
    num1=Math.floor(Math.random()*10)+1;
    num2=Math.floor(Math.random()*10)+1;
    operator=['+','-'][Math.floor(Math.random()*2)];
  } else if(currentLevel <=4){
    num1=Math.floor(Math.random()*20)+1;
    num2=Math.floor(Math.random()*20)+1;
    operator=['+','-','x','÷'][Math.floor(Math.random()*4)];
  } else{
    num1=Math.floor(Math.random()*50)+10;
    num2=Math.floor(Math.random()*50)+1;
    operator=['+','-','x','÷'][Math.floor(Math.random()*4)];
  }

  switch(operator){
    case '+': currentAnswer=num1+num2; break;
    case '-': currentAnswer=num1-num2; break;
    case 'x': currentAnswer=num1*num2; break;
    case '÷': currentAnswer=Math.floor(num1/num2); break;
  }

  document.getElementById("questionText").innerText=`${num1} ${operator} ${num2} = ?`;
  document.getElementById("answerInput").value="";
  document.getElementById("message").innerText="";

  // Timer
  timerInterval = setInterval(()=>{
    timer--;
    document.getElementById("timer").innerText=timer;
    if(timer<=0){
      clearInterval(timerInterval);
      wrong++; questionCount++;
      document.getElementById("message").style.color="red";
      document.getElementById("message").innerText=`Time's up! Answer: ${currentAnswer}`;
      nextQuestion();
    }
  },1000);
}

// Submit Answer
function submitAnswer(){
  let userAnswer=Number(document.getElementById("answerInput").value);
  clearInterval(timerInterval);
  if(userAnswer===currentAnswer){
    score+=10; correct++; 
    document.getElementById("message").style.color="green";
    document.getElementById("message").innerText="Correct!";
  } else {
    wrong++;
    document.getElementById("message").style.color="red";
    document.getElementById("message").innerText=`Wrong! Answer: ${currentAnswer}`;
  }
  questionCount++;
  updateStats();
  setTimeout(nextQuestion,800);
}

// Next Question / Level Up
function nextQuestion(){
  if(questionCount>=totalQuestions){
    endGame();
    return;
  }
  if(questionCount%5===0 && currentLevel<6) currentLevel++;
  document.getElementById("levelDisplay").innerText=currentLevel;
  generateQuestion();
}

// Update Stats
function updateStats(){
  document.getElementById("score").innerText=score;
  document.getElementById("correct").innerText=correct;
  document.getElementById("wrong").innerText=wrong;
}

// End Game
function endGame(){
  leaderboard.push({name:playerNameText,score:score});
  leaderboard.sort((a,b)=>b.score-a.score);
  displayLeaderboard();
  document.getElementById("game").style.display="none";
  document.getElementById("leaderboardSection").style.display="block";
}

// Display Leaderboard
function displayLeaderboard(){
  let lbDiv=document.getElementById("leaderboard");
  lbDiv.innerHTML="";
  leaderboard.slice(0,10).forEach((player,i)=>{
    lbDiv.innerHTML+=`<p>${i+1}. ${player.name}: ${player.score} pts</p>`;
  });
}

// Restart Game
function restartGame(){
  clearInterval(timerInterval);
  currentLevel=1; questionCount=0; score=0; correct=0; wrong=0;
  document.getElementById("playerName").value="";
  document.getElementById("leaderboardSection").style.display="none";
  document.getElementById("login").style.display="block";
}

// Enter key support
document.getElementById("answerInput").addEventListener("keyup",function(e){
  if(e.key==="Enter") submitAnswer();
});
</script>

</body>
</html>
